<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PM 中台</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e4e2dc;--acc:#2d6a4f;--acc2:#e9f3ee;--warn:#b45309;--warn2:#fdf3e2;--red:#b42318;--red2:#fdecec;--me:#eef1ff;--mono:ui-monospace,Consolas,"Microsoft JhengHei",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15161a;--panel:#1e2026;--ink:#ecebe6;--mute:#9b9a94;--line:#2f323a;--acc:#6fcf97;--acc2:#1f2e26;--warn:#f0b24a;--warn2:#332a18;--red:#f08b84;--red2:#3a1f1d;--me:#232a44}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;height:100vh;display:grid;grid-template-columns:270px 1fr;grid-template-rows:52px 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0}#status{font-size:13px;color:var(--mute);flex:1}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aaa;margin-right:6px}.dot.on{background:var(--acc)}.dot.busy{background:var(--warn);animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
select,button{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px}button:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.danger{color:var(--red)}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px}
.grp{font-size:12px;color:var(--mute);margin:12px 6px 4px;text-transform:uppercase;letter-spacing:.05em}
.act{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 10px;margin:3px 0;border-radius:10px;border:1px solid transparent}.act:hover{background:var(--acc2);border-color:var(--acc2)}.act .ic{font-size:18px;width:24px;text-align:center}.act b{display:block;font-weight:600}.act small{color:var(--mute);display:block;line-height:1.3}
main{display:grid;grid-template-rows:1fr auto;min-height:0}
#chat{overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:860px;padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.me{background:var(--me);align-self:flex-end}.msg.ai{background:var(--panel);border:1px solid var(--line)}
.msg.tool{font:13px var(--mono);color:var(--mute);padding:4px 10px;background:transparent}
.msg.sys{font-size:13px;color:var(--mute);align-self:center}.msg.err{background:var(--red2);color:var(--red)}
.card{max-width:860px;background:var(--warn2);border:1px solid var(--warn);border-radius:12px;padding:14px 16px}
.card.q{background:var(--acc2);border-color:var(--acc)}.card h3{margin:0 0 8px;font-size:15px}.card .qq{margin:10px 0}.card label{display:block;padding:6px 8px;border-radius:8px;cursor:pointer}.card label:hover{background:rgba(0,0,0,.05)}.card label small{color:var(--mute);display:block;margin-left:22px}
.card textarea,.card input[type=text]{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.card .row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}.card pre{font:13px var(--mono);background:rgba(0,0,0,.06);padding:8px;border-radius:8px;overflow:auto;max-height:200px;margin:6px 0}
footer{border-top:1px solid var(--line);background:var(--panel);padding:10px 16px;display:flex;gap:8px;align-items:flex-end}
footer textarea{flex:1;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;resize:none;height:46px;background:var(--bg);color:var(--ink)}
.tbl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:52px auto 1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:38vh}header{grid-column:1}}
</style>
</head>
<body>
<header>
  <h1>PM 中台</h1>
  <div id="status"><span class="dot"></span>連線中…</div>
  <label id="contWrap" style="font-size:13px;color:var(--mute)"><input type="checkbox" id="cont"> 接續上次對話</label>
  <select id="model" title="模型">
    <option value="claude-opus-5-5">Opus 5.5（日常）</option>
    <option value="claude-sonnet-5-5">Sonnet 5.5（省）</option>
    <option value="claude-fable-5-2">Fable 5.2（最強、最耗）</option>
    <option value="">Claude Code 預設</option>
  </select>
  <select id="mode" title="權限模式">
    <option value="default">每個動作都問我</option>
    <option value="acceptEdits">改檔不用問，其他要問</option>
    <option value="auto">自動（只問危險的）</option>
  </select>
  <button id="stop" class="danger">中斷</button>
</header>
<aside id="side"></aside>
<main>
  <div id="chat"></div>
  <footer>
    <textarea id="inp" placeholder="直接打字也可以，例如：Gen9.4 目前版是哪一份？  （Enter 送出，Shift+Enter 換行）"></textarea>
    <button id="send" class="pri">送出</button>
  </footer>
</main>
<script>
const $=s=>document.querySelector(s);const chat=$("#chat");let actions=[];let aiEl=null;
function add(cls,text){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function setStatus(on,busy,text){const dot=$("#status .dot");dot.className="dot"+(busy?" busy":on?" on":"");$("#status").lastChild.textContent=" "+text}
async function post(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});if(!r.ok){const j=await r.json().catch(()=>({}));if(j.error)add("err",j.error)}return r.ok}
function send(text){if(!text.trim())return;post("/api/run",{text,continue:$("#cont").checked});$("#inp").value=""}
$("#send").onclick=()=>send($("#inp").value);
$("#inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send($("#inp").value)}});
$("#stop").onclick=()=>post("/api/stop");
$("#mode").onchange=e=>post("/api/mode",{mode:e.target.value});
$("#model").onchange=e=>post("/api/model",{model:e.target.value});
function renderSide(){const s=$("#side");s.innerHTML="";let g="";for(const a of actions){if(a.group!==g){g=a.group;const h=document.createElement("div");h.className="grp";h.textContent=g;s.appendChild(h)}
 const b=document.createElement("button");b.className="act";b.innerHTML=`<span class="ic">${a.icon||"•"}</span><span><b>${a.label}</b><small>${a.desc||""}</small></span>`;
 b.onclick=()=>{if(a.ask){const v=prompt(a.ask);if(v==null||!v.trim())return;send(a.prompt+v.trim())}else send(a.prompt)};s.appendChild(b)}}
function renderAsk(ev){
 const c=document.createElement("div");c.className="card"+(ev.kind==="question"?" q":"");c.dataset.rid=ev.requestId;
 if(ev.kind==="question"){
  c.innerHTML="<h3>Claude 需要妳決定</h3>";
  ev.input.questions.forEach((qq,i)=>{const d=document.createElement("div");d.className="qq";d.innerHTML=`<b>${esc(qq.header||"")}</b>　${esc(qq.question)}`;
   qq.options.forEach(o=>{d.insertAdjacentHTML("beforeend",`<label><input type="${qq.multiSelect?"checkbox":"radio"}" name="q${i}" value="${esc(o.label)}"> ${esc(o.label)}<small>${esc(o.description||"")}</small></label>`)});
   d.insertAdjacentHTML("beforeend",`<label><input type="${qq.multiSelect?"checkbox":"radio"}" name="q${i}" value="__other"> 其他：<input type="text" data-other="q${i}" placeholder="自己填"></label>`);c.appendChild(d)});
  const row=document.createElement("div");row.className="row";const ok=document.createElement("button");ok.className="pri";ok.textContent="送出回答";
  ok.onclick=()=>{const answers={};ev.input.questions.forEach((qq,i)=>{const picked=[...c.querySelectorAll(`input[name=q${i}]:checked`)].map(x=>x.value==="__other"?c.querySelector(`input[data-other=q${i}]`).value.trim():x.value).filter(Boolean);
   answers[qq.question]=qq.multiSelect?picked:(picked[0]||"")});post("/api/answer",{requestId:ev.requestId,answers});c.querySelectorAll("button,input").forEach(x=>x.disabled=true)};
  row.appendChild(ok);c.appendChild(row);
 }else{
  c.innerHTML=`<h3>Claude 想執行：${esc(ev.toolName)}</h3>`+(ev.reason?`<div style="color:var(--mute)">${esc(ev.reason)}</div>`:"")+`<pre>${esc(pretty(ev.toolName,ev.input))}</pre>`;
  const row=document.createElement("div");row.className="row";
  const ok=document.createElement("button");ok.className="pri";ok.textContent="允許";ok.onclick=()=>{post("/api/answer",{requestId:ev.requestId});c.querySelectorAll("button").forEach(x=>x.disabled=true)};
  const al=document.createElement("button");al.textContent="這次都允許 "+ev.toolName;al.onclick=()=>{post("/api/answer",{requestId:ev.requestId,always:true});c.querySelectorAll("button").forEach(x=>x.disabled=true)};
  const no=document.createElement("button");no.className="danger";no.textContent="拒絕";no.onclick=()=>{const m=prompt("要跟 Claude 說為什麼嗎？（可空白）")||"使用者拒絕";post("/api/answer",{requestId:ev.requestId,deny:true,message:m});c.querySelectorAll("button").forEach(x=>x.disabled=true)};
  row.append(ok,al,no);c.appendChild(row)}
 chat.appendChild(c);chat.scrollTop=chat.scrollHeight}
function pretty(name,input){if(name==="Bash")return input.command||"";if(name==="Write")return(input.file_path||"")+"\n（寫入 "+String(input.content||"").length+" 字）";if(name==="Edit")return(input.file_path||"")+"\n- "+(input.old_string||"").slice(0,200)+"\n+ "+(input.new_string||"").slice(0,200);return JSON.stringify(input,null,1).slice(0,800)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function handle(ev){
 switch(ev.type){
  case"hello":actions=ev.actions;renderSide();$("#mode").value=ev.state.mode;$("#model").value=ev.state.model||"";(ev.state.history||[]).forEach(h=>{if(h.type!=="ask"||h===ev.state.pending)handle(h)});setStatus(true,ev.state.running,ev.state.running?"Claude 工作中…":"就緒");break;
  case"user":aiEl=null;add("me",ev.text);setStatus(true,true,"Claude 工作中…");break;
  case"delta":if(!aiEl)aiEl=add("ai","");aiEl.textContent+=ev.text;chat.scrollTop=chat.scrollHeight;break;
  case"assistant":if(aiEl){aiEl.textContent=ev.text;aiEl=null}else add("ai",ev.text);break;
  case"tool":aiEl=null;add("tool","▸ "+ev.name+"  "+ev.input);break;
  case"ask":aiEl=null;renderAsk(ev);setStatus(true,false,"等妳回答");break;
  case"answered":{const c=chat.querySelector(`.card[data-rid="${ev.requestId}"]`);if(c)c.insertAdjacentHTML("beforeend",`<div style="margin-top:8px;color:var(--mute)">${esc(ev.text)}</div>`);setStatus(true,true,"Claude 工作中…");break}
  case"done":aiEl=null;add("sys",(ev.ok?"完成":"中止")+(ev.cost?`　（$${ev.cost.toFixed(3)}）`:"")+(ev.errors&&ev.errors.length?"　"+ev.errors.join("；"):""));setStatus(true,false,"就緒");break;
  case"status":add("sys",ev.text);setStatus(ev.running!==false,ev.running,ev.text);if(ev.started){$("#cont").checked=false;$("#contWrap").style.display="none"}if(ev.running===false&&ev.text.includes("已停止"))$("#contWrap").style.display="";break;
  case"error":aiEl=null;add("err",ev.text);setStatus(false,false,"發生錯誤");break;
 }}
function connect(){const es=new EventSource("/api/events");es.onmessage=e=>handle(JSON.parse(e.data));es.onerror=()=>{setStatus(false,false,"中台沒回應，確認 start.bat 的視窗還開著");es.close();setTimeout(connect,3000)}}
connect();
</script>
</body>
</html>
